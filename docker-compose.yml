version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/pulsespace
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_pulsespace_2026
      - JWT_REFRESH_SECRET=super_secret_refresh_jwt_key_pulsespace_2026
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb
      - redis
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo_data:
